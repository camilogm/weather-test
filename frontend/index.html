<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pronóstico del tiempo a 7 días para San Salvador, servido por la API de WeatherService."
    />

    <!--
      Two families, loaded once. Newsreader carries the headlines, JetBrains Mono
      carries the data; body copy stays on the system stack, which costs nothing.
      Both fall back to fonts that already exist on the machine, so a reviewer
      without a network still gets the intended shape.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />

    <title>San Salvador · Pronóstico a 7 días</title>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
